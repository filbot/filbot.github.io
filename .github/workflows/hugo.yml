# Builds the Hugo site and deploys it to GitHub Pages.
# Actions are pinned to commit SHAs; Dependabot (.github/dependabot.yml) keeps them current.
name: Deploy Hugo site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["master"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

# Default to bash
defaults:
  run:
    shell: bash

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.167.0
    steps:
      - name: Install Hugo CLI
        working-directory: ${{ runner.temp }}
        run: |
          base=https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}
          deb=hugo_extended_${HUGO_VERSION}_linux-amd64.deb
          wget -q "$base/$deb" "$base/hugo_${HUGO_VERSION}_checksums.txt"
          grep " $deb\$" hugo_${HUGO_VERSION}_checksums.txt | sha256sum -c -
          sudo dpkg -i "$deb"
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check media for location metadata
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libimage-exiftool-perl > /dev/null
          found=$(exiftool -q -q -r -ee -if '$GPSLatitude or $GPSCoordinates or $GPSPosition' -p '$Directory/$FileName' content static assets || true)
          if [ -n "$found" ]; then
            echo "::error::GPS metadata found. Run scripts/clean-images.py on these files:"
            echo "$found"
            exit 1
          fi
      - name: Cache Hugo build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            resources/_gen
            ${{ runner.temp }}/hugo_cache
          key: ${{ runner.os }}-hugo-${{ env.HUGO_VERSION }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-hugo-${{ env.HUGO_VERSION }}-
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
        run: |
          hugo \
            --gc \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./public

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
