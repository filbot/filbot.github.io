{{ define "main" }}
<section>
    {{ with .Content }}
        {{- . -}}
    {{ end }}

    {{ $projects := where .Site.RegularPages "Section" "projects" }}
    {{ range $projects.ByDate.Reverse }}
    <section class="projects">
      <h3><a href="{{ .Permalink }}">{{ .Title }}</a></h3>
      <p>{{ .Description }}</p>
    </section>
    {{ end }}
</section>
{{ end }}
