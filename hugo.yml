baseURL: https://filbot.com/
languageCode: en-us
title: Semicolons & Side Projects
theme: mini
pagination:
    pagerSize: 10
googleAnalytics: G-P5HRT1QBKC

permalinks:
    posts: /posts/:title/

# Image processing defaults
imaging:
  quality: 85
  resampleFilter: Lanczos
  anchor: Smart

# Minification settings (applied with --minify flag)
minify:
  disableXML: false
  minifyOutput: true
  tdewolff:
    html:
      keepWhitespace: false
    css:
      precision: 2
    js:
      precision: 2

# Asset caching (local development and resources)
caches:
  getresource:
    maxAge: "24h"
  images:
    dir: ":resourceDir/_gen"
    maxAge: "720h"  # 30 days
  assets:
    dir: ":resourceDir/_gen"
    maxAge: "720h"

# Security defaults
security:
  enableInlineShortcodes: false
  exec:
    allow:
      - ^(dart-)?sass(-embedded)?$
      - ^go$
      - ^npx$
      - ^postcss$

markup:
    highlight:
        guessSyntax: true
        style: github
    goldmark:
        renderer:
            unsafe: false  # Don't allow raw HTML in markdown

params:
  social:
    linkedin: https://linkedin.com/in/filip-grace-1255b06
    github: https://github.com/filbot
    instagram: https://instagram.com/filipekadamczyk
  enableGoogleAnalytics: true
  bio: "A personal blog about building, learning, and stumbling forward in dev"

timeout: 5m
