{{ define "main" }}
<section class="home">
  {{ $projects := where .Site.RegularPages "Section" "projects" }}
  {{ if $projects }}
    <section class="home-projects" aria-labelledby="recent-projects">
      <h2 id="recent-projects" class="section-eyebrow">Recent Projects</h2>
      <div class="project-list">
        {{ range $projects.ByDate.Reverse }}
          {{ partial "project-card.html" . }}
        {{ end }}
      </div>
    </section>
  {{ end }}
</section>
{{ end }}
