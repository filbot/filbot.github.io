{{ define "main" }}
<article>
  <nav aria-label="All projects">
    <a href="/">&larr; Back to All Projects</a>
  </nav>
  <header>
    <h1>{{ .Title }}</h1>
    {{ partial "post-dates.html" . }}
    {{ with .Params.repository }}
      <nav>
        <ul>
          <li><a href="{{ . }}" class="button">Repository</a></li>
        </ul>
      </nav>
    {{ end }}
  </header>

  {{ partial "article-body.html" . }}
  {{ partial "related.html" . }}
</article>
{{ end }}
