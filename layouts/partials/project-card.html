<article class="project-card">
  <div class="project-card__image">
    {{ with .Params.cover }}
      {{ with $.Resources.GetMatch . }}
        {{ $thumb := .Fill "640x427 webp q85" }}
        <a href="{{ $.Permalink }}" tabindex="-1" aria-hidden="true">
          <img
            src="{{ $thumb.RelPermalink }}"
            width="{{ $thumb.Width }}"
            height="{{ $thumb.Height }}"
            alt=""
            loading="lazy"
            decoding="async" />
        </a>
      {{ end }}
    {{ end }}
  </div>
  <div class="project-card__body">
    {{ with .Date }}
      <time class="project-card__date" datetime="{{ .Format "2006-01-02" }}">
        {{ .Format "January 2006" }}
      </time>
    {{ end }}
    <h3><a href="{{ .Permalink }}">{{ .Title }}</a></h3>
    <p>{{ .Description }}</p>
  </div>
</article>
