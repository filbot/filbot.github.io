{{ with .Paginator }}
  {{ if gt .TotalPages 1 }}
    <nav class="pagination" aria-label="Pagination">
      {{ if .HasPrev }}
        <a href="{{ .Prev.URL }}" class="button" rel="prev">&#9664; {{ site.Params.newerPosts | default "Newer" }}</a>
      {{ end }}
      {{ if .HasNext }}
        <a href="{{ .Next.URL }}" class="button" rel="next">{{ site.Params.olderPosts | default "Older" }} &#9658;</a>
      {{ end }}
    </nav>
  {{ end }}
{{ end }}
