baseURL = "https://filbot.com/"
locale = "en-us"
title = "Semicolons & Side Projects"
disableKinds = ["taxonomy", "term"]
enableRobotsTXT = true

[pagination]
  pagerSize = 10

[services.googleAnalytics]
  ID = "G-P5HRT1QBKC"

[permalinks]
  projects = "/:slug/"

[markup.highlight]
  guessSyntax = true
  noClasses = false
  tabWidth = 2

[markup.goldmark.renderer]
  unsafe = false

[[menu.header]]
  name = "About"
  url = "/about/"
  weight = 10

[params]
  author = "Filip Grace"
  description = "A personal blog about building, learning, and stumbling forward in dev"
  logo = "images/avatar.svg"

  [params.social]
    linkedin = "https://linkedin.com/in/filip-grace-1255b06"
    github = "https://github.com/filbot"
    instagram = "https://instagram.com/filipekadamczyk"
    feed = "/index.xml"

[imaging]
  quality = 85
  resampleFilter = "Lanczos"
  anchor = "Smart"

[security]
  enableInlineShortcodes = false

[minify]
  disableXML = false
  minifyOutput = true
  [minify.tdewolff.html]
    keepWhitespace = false
  [minify.tdewolff.css]
    precision = 2
  [minify.tdewolff.js]
    precision = 2
