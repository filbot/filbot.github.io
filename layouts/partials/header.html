<header class="site-header">
  {{ with site.Params.logo }}
    <a href="{{ site.Home.RelPermalink }}" class="site-header__logo">
      <img src="{{ . | relURL }}" alt="" width="55" height="55">
    </a>
  {{ end }}
  <hgroup>
    {{- /* The site name is the h1 only on the home page; elsewhere the page's own title is. */ -}}
    {{ if .IsHome }}
      <h1 class="site-header__title"><a href="{{ site.Home.RelPermalink }}">{{ site.Title }}</a></h1>
    {{ else }}
      <p class="site-header__title"><a href="{{ site.Home.RelPermalink }}">{{ site.Title }}</a></p>
    {{ end }}
  </hgroup>
</header>
